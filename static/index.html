<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHUNITHM Data UI</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>CHUNITHM Data UI</h1>
      <p id="game-root">Loading catalog...</p>
    </div>
    <button id="rescan" type="button">Rescan</button>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-category="music" type="button">Music</button>
        <button class="tab" data-category="characters" type="button">Characters</button>
        <button class="tab" data-category="nameplates" type="button">Name Plates</button>
      </div>
      <label class="search">
        <span>Search</span>
        <input id="search" type="search" placeholder="Title, artist, category...">
        <span id="results-count" class="results-count">Loading results...</span>
      </label>
    </section>

    <section class="content">
      <div id="table-shell" class="table-wrap">
        <table>
          <thead id="table-head"></thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div id="character-grid" class="character-grid hidden" aria-live="polite"></div>
    </section>
  </main>

  <div id="image-modal" class="modal hidden" aria-hidden="true">
    <div id="image-modal-backdrop" class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="image-modal-title">
      <button id="image-modal-close" class="modal-close" type="button" aria-label="Close image preview">×</button>
      <p id="image-modal-title" class="modal-title">Character image preview</p>
      <img id="image-modal-image" class="modal-image" alt="">
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
